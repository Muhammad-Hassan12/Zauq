name: Zauq v4 Continuous Integration

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-asyncio pytest-cov

    - name: Pre-pull Docker Sandbox Images
      run: |
        docker pull python:3.11-slim
        docker pull node:18-alpine
        docker pull alpine:latest

    # Stage 1: Syntax & Import Verification
    - name: "Stage 1: Syntax & Core Import Verification"
      run: |
        python -c "import backend.main, backend.config, backend.agent.runtime, backend.models.router, backend.security; print('All core modules imported successfully.')"

    # Stage 2: Unit Tests (Agent, Tools, Models)
    - name: "Stage 2: Unit Tests (Agent, Tools, Models)"
      run: pytest tests/agent/ tests/tools/ tests/models/ -v

    # Stage 3: Search Mocks
    - name: "Stage 3: Search Subsystem Mocks"
      run: pytest tests/search/ -v

    # Stage 4: MCP In-Process Test Server
    - name: "Stage 4: MCP Client & Tool Adapter Tests"
      run: pytest tests/mcp/ -v

    # Stage 5: Security Tests
    - name: "Stage 5: Security Hardening & SSRF Defense Tests"
      run: pytest tests/security/ -v

    # Stage 6: Docker Sandbox Tests
    - name: "Stage 6: Docker Sandbox Tests"
      run: pytest tests/sandbox/ -v

    # Stage 7: Integration Tests (Chat flows, Feature Matrix, Observability, Actions, Bot)
    - name: "Stage 7: Integration & Regression Checklist Tests"
      run: pytest tests/integration/ tests/observability/ tests/actions/ tests/bot/ tests/chat/ -v

    # Backward Compatibility Validation (Legacy suites)
    - name: "Backward Compatibility: Legacy Utility Suites"
      run: |
        python -m backend.utils.test_security_hardening
        python -m backend.utils.test_sandbox_suite
        python -m backend.utils.test_deep_search
        python -m backend.utils.test_info_command
        python -m backend.utils.test_reply_ingestion
