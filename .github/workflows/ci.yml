name: Zauq Automated Test Suites

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Security Hardening Suite
      run: python -m backend.utils.test_security_hardening

    - name: Run Multi-Input Sandbox Suite
      run: python -m backend.utils.test_sandbox_suite

    - name: Run Deep Search Suite
      run: python -m backend.utils.test_deep_search

    - name: Run Info Command Suite
      run: python -m backend.utils.test_info_command

    - name: Run Reply Ingestion Suite
      run: python -m backend.utils.test_reply_ingestion
