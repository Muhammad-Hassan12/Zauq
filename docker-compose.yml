services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zauq-backend
    restart: unless-stopped
    ports:
      - "127.0.0.1:8002:8002"
    env_file:
      - .env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      - SANDBOX_RUNNER_URL=http://sandbox-runner:8001
      - BACKEND_HOST=0.0.0.0
      - DEVELOPMENT_MODE=false
    depends_on:
      - sandbox-runner
    networks:
      - zauq_network

  sandbox-runner:
    build:
      context: .
      dockerfile: Dockerfile.runner
    container_name: zauq-sandbox-runner
    command: python -m uvicorn backend.sandbox.runner_service:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    volumes:
      # Only the isolated sandbox runner gets access to the Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SANDBOX_HOST_SPOOL_DIR:-/var/lib/zauq/sandbox}:/sandbox-spool
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      - DEVELOPMENT_MODE=false
      - SANDBOX_MAX_CONCURRENCY=${SANDBOX_MAX_CONCURRENCY:-1}
      - SANDBOX_DEFAULT_TIMEOUT_SECONDS=${SANDBOX_DEFAULT_TIMEOUT_SECONDS:-8}
      - SANDBOX_MAX_OUTPUT_CHARS=${SANDBOX_MAX_OUTPUT_CHARS:-12000}
      - SANDBOX_SPOOL_DIR=/sandbox-spool
      - SANDBOX_HOST_SPOOL_DIR=${SANDBOX_HOST_SPOOL_DIR:-/var/lib/zauq/sandbox}
    networks:
      - zauq_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: zauq-bot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - INTERNAL_API_KEY=${INTERNAL_API_KEY:?Set INTERNAL_API_KEY}
      - BACKEND_HOST=backend
      - BACKEND_PORT=8002
    depends_on:
      - backend
    networks:
      - zauq_network

networks:
  zauq_network:
    driver: bridge
