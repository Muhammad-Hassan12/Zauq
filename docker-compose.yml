version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zauq-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      - SANDBOX_RUNNER_URL=http://sandbox-runner:8001
    depends_on:
      - sandbox-runner
    networks:
      - zauq_network

  sandbox-runner:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: zauq-sandbox-runner
    command: python -m uvicorn backend.sandbox.runner_service:app --host 0.0.0.0 --port 8001
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      # Only the isolated sandbox runner gets access to the Docker socket
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - zauq_network

  bot:
    build:
      context: .
      dockerfile: Dockerfile.bot
    container_name: zauq-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - backend
    networks:
      - zauq_network

networks:
  zauq_network:
    driver: bridge
